# Render Blueprint Specification for Nimbus SaaS Platform
# https://render.com/docs/blueprint-spec

services:
  # Standalone Full-Stack Web Service (FastAPI + React SPA)
  - type: web
    name: nimbus-saas
    runtime: docker
    dockerfilePath: ./Dockerfile.standalone
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_SEARCH_PROVIDER
        value: duckduckgo
