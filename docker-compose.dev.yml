# Development overlay: hot reload for both tiers.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: nimbus

services:
  api:
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      SQL_ECHO: "false"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"
    ports:
      - "5173:5173"
